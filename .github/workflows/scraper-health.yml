name: Scraper Health Check

on:
  schedule:
    # Weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Health check mode'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - full

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run health check
        id: health
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          if [ "$MODE" = "full" ]; then
            uv run python scripts/run_health_check.py --full --save --history --workers 3 2>&1 | tee health_output.txt
          else
            uv run python scripts/run_health_check.py --save --history --workers 3 2>&1 | tee health_output.txt
          fi
        continue-on-error: true

      - name: Build dashboard
        if: always()
        run: uv run python scripts/build_dashboard.py

      - name: Commit health history and dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add health_history.jsonl docs/index.html
          git diff --cached --quiet || git commit -m "Update health history and dashboard [skip ci]"
          git push

      - name: Upload health results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-results
          path: health_results.json

      - name: Create or update issue on failure
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('health_results.json', 'utf8'));
            } catch (e) {
              report = { summary: { errors: 'unknown' }, results: [] };
            }

            const failed = (report.results || [])
              .filter(r => r.status === 'error' || r.status === 'empty')
              .map(r => `- **${r.name}**: ${r.status}${r.error ? ' - ' + r.error : ''}`)
              .join('\n');

            const summary = report.summary || {};
            const body = `## Scraper Health Report

            **Date:** ${new Date().toISOString().split('T')[0]}
            **Mode:** ${report.mode || 'quick'}

            | Metric | Count |
            |--------|-------|
            | Total | ${summary.total || '?'} |
            | OK | ${summary.ok || '?'} |
            | Empty | ${summary.empty || '?'} |
            | No Dates | ${summary.no_dates || '?'} |
            | Errors | ${summary.errors || '?'} |
            | Success Rate | ${summary.success_rate || '?'}% |

            ### Failed Scrapers
            ${failed || 'None'}

            ---
            *Auto-generated by scraper health check workflow*`;

            // Find existing issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'scraper-health',
              state: 'open',
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body,
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Scraper Health Report - Failures Detected',
                body: body,
                labels: ['scraper-health'],
              });
            }
